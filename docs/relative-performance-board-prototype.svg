  <text x="946" y="50" style="font-family: PingFang SC, Microsoft YaHei, Arial, sans-serif; fill:#9a3be8; font-size:27px; font-weight:800;">中材科技</text>
  <text x="1078" y="50" style="font-family: PingFang SC, Microsoft YaHei, Arial, sans-serif; fill:#f4b000; font-size:27px; font-weight:800;">德福科技</text>

