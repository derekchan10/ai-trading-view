<svg width="1440" height="940" viewBox="0 0 1440 940" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .page { fill: #ffffff; }
      .text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #101828; }
      .muted { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #667085; }
      .title { font-size: 31px; font-weight: 800; }
      .h2 { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .tiny { font-size: 11px; }
      .btn { font-size: 13px; font-weight: 700; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .axis { fill: #a7b0be; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 12px; }
      .white { fill: #ffffff; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .chip { fill: #ffffff; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .grid { stroke: #2b323a; stroke-width: 1; stroke-dasharray: 2 5; }
      .gridStrong { stroke: #3f4651; stroke-width: 1; }
      .panel { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1; }
      .black { fill: #050505; }
      .tableHead { fill: #050505; }
    </style>
  </defs>

  <rect width="1440" height="940" class="page"/>

  <!-- Top title and legend -->
